<script>
    let lastResults = {}; // id -> contact object, populated on search

    //Convert google.script.run to a promise
    function gsRun(funcName, ...args) {
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
            [funcName](...args);
        });
    }

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    //On enter in search term click the search button
    document.getElementById('searchTerm').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('searchButton').click();
        }
    });

    //On click for search term...
    document.getElementById('searchButton').addEventListener('click', async () => {
        const results = document.getElementById('results');
        const needle = document.getElementById("searchTerm").value;
        results.innerHTML = "";
        if (!needle.trim())
            return;
        const res = await gsRun('search', token, needle);
        console.log(res);

        lastResults = {};
        res.Contacts.forEach(c => { lastResults[c.Id] = c; });

        results.innerHTML = res.Contacts.map(c => `
          <tr data-id="${esc(c.Id)}" data-email="${esc(c.Email)}">
            <td>${esc(c.FirstName)} ${esc(c.LastName)}</td>
            <td>${esc(c.Email)}</td>
            <td>${c.Status != "PendingNew" ? "" : "<button>Activate</button>"}</td>
          </tr>
        `).join('');
    });

    //Per Member Activate Button Check
    document.getElementById('results').addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            const row = e.target.closest('tr');
            beginActivation(row.dataset.id, e.target);
        }
    });

    let activeContactId = null;

    async function beginActivation(id, btnEl) {
        const c = lastResults[id];
        if (!c) {
            console.error("No cached contact for id", id);
            return;
        }
        activeContactId = id;

        // check for problems, list them
        const problems = await gsRun('canActivate', c);
        const problemList = document.getElementById('problemList');
        problemList.innerHTML = problems.map(p => `<li>${esc(p)}</li>`).join('');
        
        const hasProblems = problems.length > 0;

        //Update UI
        const searchDiv = document.getElementById('search');
        const activateDiv = document.getElementById('activate');
        searchDiv.style.display = "none";
        activateDiv.style.display = "block";

        // fill out name
        document.getElementById('name').textContent = `${c.FirstName} ${c.LastName}`;


        // reset form fields for the new contact
        document.getElementById('waiverCheck').checked = false;
        document.getElementById('memberAgreementCheck').checked = false;
        document.getElementById('keyCardNumber').value = '';

        // disable inputs/submit if problems exist
        document.getElementById('waiverCheck').disabled = hasProblems;
        document.getElementById('memberAgreementCheck').disabled = hasProblems;
        document.getElementById('keyCardNumber').disabled = hasProblems;
        document.getElementById('activateSubmitBtn').disabled = hasProblems;
    }

    document.getElementById('activateSubmitBtn').addEventListener('click', () => {
        doActivate(activeContactId);
    });

    document.getElementById('cancelActivateBtn').addEventListener('click', () => {
        document.getElementById('activate').style.display = "none";
        document.getElementById('search').style.display = "block";
        activeContactId = null;
    });

    async function doActivate(id) {
        const waiver = document.getElementById('waiverCheck').checked;
        const memberAgreement = document.getElementById('memberAgreementCheck').checked;
        const keyCardNumber = document.getElementById('keyCardNumber').value.trim();

        if (!waiver || !memberAgreement) {
            alert("Both Waiver and Member Agreement must be confirmed.");
            return;
        }
        if (!keyCardNumber) {
            alert("Key Card Number is required.");
            return;
        }

        const submitBtn = document.getElementById('activateSubmitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Activating...";

        try {
            await gsRun('activate', token, id, waiver, memberAgreement, keyCardNumber);
            alert("Activated.");
            document.getElementById('activate').style.display = "none";
            document.getElementById('search').style.display = "block";
            activeContactId = null;
            // clear stale results since this contact's Status has now changed
            document.getElementById('results').innerHTML = "";
            document.getElementById('searchTerm').value = "";
        } catch (e) {
            console.error("Activate Error", e);
            alert("Activation failed: " + e.message);
            submitBtn.disabled = false;
            submitBtn.textContent = "Activate";
        }
    }
</script>
